services:
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/lifepilot.db}
      MCP_PORT: "8002"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LIFE_PILOT_BOOTSTRAP_USERNAME: ${LIFE_PILOT_BOOTSTRAP_USERNAME:-admin}
      LIFE_PILOT_BOOTSTRAP_PASSWORD: ${LIFE_PILOT_BOOTSTRAP_PASSWORD:?Set bootstrap password in .env}
    volumes:
      - lifepilot-data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
      - "${MCP_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "lifepilot.scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/lifepilot.db}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - lifepilot-data:/app/data
volumes:
  lifepilot-data:
