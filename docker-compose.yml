services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifepilot}
      POSTGRES_USER: ${POSTGRES_USER:-lifepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SECRET_KEY:?Set SECRET_KEY in .env}}
    volumes:
      - lifepilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-lifepilot}@db:5432/${POSTGRES_DB:-lifepilot}}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${SECRET_KEY}}
      MCP_PORT: "8002"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LIFE_PILOT_BOOTSTRAP_USERNAME: ${LIFE_PILOT_BOOTSTRAP_USERNAME:-admin}
      LIFE_PILOT_BOOTSTRAP_PASSWORD: ${LIFE_PILOT_BOOTSTRAP_PASSWORD:?Set bootstrap password in .env}
    volumes:
      - lifepilot-data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
      - "${MCP_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "lifepilot.scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-lifepilot}@db:5432/${POSTGRES_DB:-lifepilot}}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${SECRET_KEY}}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - lifepilot-data:/app/data
volumes:
  lifepilot-data:
  lifepilot-postgres:
